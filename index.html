<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Christmas Bean Blaster — mobile</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root{
    --card:#020617;         /* darker night sky */
    --accent:#22c55e;       /* festive green */
    --ink:#f9fafb;
  }
  html,body{
    margin:0;
    height:100%;
    background:radial-gradient(circle at top, #0f172a 0, #020617 55%);
    color:var(--ink);
    font-family:system-ui,Arial;
  }
  .page{
    min-height:100svh;
    display:grid;
    place-items:center;
    padding:12px;
  }
  /* Stage = same CSS size as the canvas, set from JS */
  .stage{
    position:relative;
    display:block;
  }
  canvas#game{
    width:100%;
    height:100%;
    background:linear-gradient(#020617,#020617);
    border:2px solid var(--accent);
    border-radius:16px;
    box-shadow:0 12px 30px rgba(0,0,0,.6);
    touch-action:none;
  }

  /* Title + HUD inside the display */
  .titlebar{
    position:absolute;
    top:8px;
    left:50%;
    transform:translateX(-50%);
    font-weight:800;
    opacity:.95;
    z-index:3;
    letter-spacing:.4px;
  }
  .hud{
    position:absolute;
    top:36px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:14px;
    font-weight:700;
    background:rgba(15,23,42,.85);
    padding:6px 10px;
    border-radius:999px;
    z-index:3;
    box-shadow:0 4px 12px rgba(0,0,0,.45);
  }

  /* Overlays */
  .overlay{
    position:absolute;
    inset:0;
    display:grid;
    place-items:center;
    z-index:5;
    color:#e6efff;
    text-align:center;
    text-shadow:0 2px 6px rgba(0,0,0,.6);
  }
  .overlay-bg{
    position:absolute;
    inset:0;
    border-radius:16px;
    background:linear-gradient(
      transparent,
      rgba(15,23,42,.75) 40%,
      rgba(15,23,42,.9)
    );
  }
  .start .pill{
    position:relative;
    background:rgba(15,23,42,.9);
    border:1px solid #1b2557;
    border-radius:999px;
    padding:10px 16px;
    font-weight:800;
  }
  .winbox{
    position:relative;
    background:rgba(15,23,42,.9);
    border:1px solid #22c55e;
    border-radius:16px;
    padding:12px;
    display:flex;
    flex-direction:column;
    gap:10px;
    align-items:center;
  }
  .winbox img{
    max-width:88%;
    max-height:48vh;
    height:auto;
    border-radius:12px;
    display:block;
  }
  .winbox figcaption{
    font-weight:800;
    letter-spacing:.3px;
  }
  .btn{
    background:var(--accent);
    border:none;
    color:#fff;
    padding:10px 16px;
    border-radius:999px;
    cursor:pointer;
    font-weight:700;
  }

  .hidden{display:none !important;}

  /* Controls inside the display (bottom-center) */
  .touch-controls{
    position:absolute;
    left:0;
    right:0;
    bottom:10px;
    display:flex;
    justify-content:center;
    gap:12px;
    padding:0 10px;
    pointer-events:none;
    z-index:3;
  }
  .tc-group{
    display:flex;
    gap:12px;
    pointer-events:auto;
  }
  .tc-btn{
    min-width:clamp(50px,13vw,70px);
    min-height:clamp(50px,13vw,70px);
    border-radius:14px;
    border:1px solid #1b2557;
    background:linear-gradient(#020617,#020617);
    color:#e5e7eb;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    user-select:none;
    touch-action:none;
    box-shadow:0 4px 14px rgba(0,0,0,.5);
  }
  .tc-btn:active{transform:scale(.98)}
  .tc-fire{
    min-width:clamp(72px,20vw,102px);
  }
  @media (prefers-reduced-motion:reduce){
    .tc-btn{transition:none}
  }
</style>
</head>
<body>
  <div class="page">
    <!-- Stage matches canvas size exactly -->
    <div id="stage" class="stage" aria-label="Game area">
      <div class="titlebar">Christmas Bean Blaster 🎄</div>
      <div class="hud">
        <div>Gifts: <span id="beans">0</span></div>
        <div>Lives: <span id="lives">3</span></div>
      </div>

      <canvas id="game" width="480" height="720" aria-label="Bjorn Beans canvas"></canvas>

      <!-- Start overlay -->
      <div id="startOverlay" class="overlay start">
        <div class="overlay-bg"></div>
        <div class="pill">Tap to start delivering gifts 🎁</div>
      </div>

      <!-- Win overlay (GIF + footer + play again) -->
      <div id="winOverlay" class="overlay hidden" aria-live="polite">
        <div class="overlay-bg"></div>
        <figure class="winbox">
          <img id="winGif" src="" alt="Well done animation" />
          <figcaption>Merry Christmas!! 🎄</figcaption>
          <button id="playAgain" class="btn">Play again</button>
        </figure>
      </div>

      <!-- Controls INSIDE the display -->
      <div id="touchControls" class="touch-controls">
        <div class="tc-group">
          <button id="btnLeft"  class="tc-btn" aria-label="Move left">⬅️</button>
          <button id="btnRight" class="tc-btn" aria-label="Move right">➡️</button>
        </div>
        <div class="tc-group">
          <button id="btnFire"  class="tc-btn tc-fire" aria-label="Fire">🎄 FIRE</button>
        </div>
      </div>
    </div>
  </div>

<script>
/* ==================== CONFIG ==================== */
const BASE_W = 480, BASE_H = 720;                // logical game size
const VERSION = "v18-xmas";                      // bump to bust cache
const PLAYER_IMG_FILE = "ship.png";              // same as before
const WIN_GIF_FILE    = "beans.gif";             // same as before
const PLAYER_IMG_SRC  = `./${PLAYER_IMG_FILE}?v=${VERSION}`;
const WIN_GIF_BASE    = `./${WIN_GIF_FILE}?v=${VERSION}`; // timestamp added on win to replay

const BASE_SHIP_HEIGHT = 108;

/* 🎁 Gifts (bullets) ~2x bigger */
const BASE_BEAN_W = 44, BASE_BEAN_H = 68;

/* ⛄ Snowmen (enemies) ~2x bigger */
const ENEMY_BASE_W = 48, ENEMY_BASE_H = 40;
const ENEMY_SCALE  = 1.45;
const ENEMY_COLS = 7, ENEMY_ROWS = 3;

/* Optional external images (leave "" to use built-in SVGs) */
const BEAN_IMG_SRC  = "";
const ALIEN_IMG_SRC = "";

/* ============== Canvas (HiDPI + responsive fit) ============== */
const stage = document.getElementById('stage');
const c = document.getElementById('game');
const g = c.getContext('2d');
const touchControls = document.getElementById('touchControls');
const startOverlay  = document.getElementById('startOverlay');
const winOverlay    = document.getElementById('winOverlay');
const winGifEl      = document.getElementById('winGif');
const playAgainBtn  = document.getElementById('playAgain');

const titleEl = document.querySelector('.titlebar');
const hudEl   = document.querySelector('.hud');

let scaleCSS = 1, dpr = 1, SAFE_BOTTOM = 100, SAFE_TOP = 0;

/** Fit by BOTH width & height; stage size == canvas CSS size */
function resizeCanvas(){
  const vw = window.innerWidth, vh = window.innerHeight;
  const margin = 12;
  const availW = Math.max(320, vw - margin*2);
  const availH = Math.max(360, vh - margin*2);

  const scaleByW = availW / BASE_W;
  const scaleByH = availH / BASE_H;
  const MIN_SCALE = 0.35, MAX_SCALE = 0.85;
  scaleCSS = Math.max(MIN_SCALE, Math.min(MAX_SCALE, Math.min(scaleByW, scaleByH)));

  const cssW = Math.round(BASE_W * scaleCSS);
  const cssH = Math.round(BASE_H * scaleCSS);

  stage.style.width  = cssW + 'px';
  stage.style.height = cssH + 'px';

  dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1)); // cap DPR for perf
  c.width  = Math.round(BASE_W * dpr);
  c.height = Math.round(BASE_H * dpr);
  g.setTransform(dpr, 0, 0, dpr, 0, 0);

  const ctrlH_css  = touchControls.getBoundingClientRect().height || 110;
  const titleH_css = titleEl?.getBoundingClientRect().height || 0;
  const hudH_css   = hudEl?.getBoundingClientRect().height   || 0;

  SAFE_BOTTOM = Math.round((ctrlH_css / cssH) * BASE_H) + 8;
  SAFE_TOP    = Math.round(((titleH_css + hudH_css + 10) / cssH) * BASE_H);

  recalcSpriteSizes();
}
addEventListener('resize', resizeCanvas);

/* ==================== Inputs ==================== */
const keys = {};
addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.code === 'Space') e.preventDefault();
}, {passive:false});
addEventListener('keyup',   e => keys[e.key.toLowerCase()] = false);

/* Start overlay actions */
function hideStart(){ startOverlay.classList.add('hidden'); }
startOverlay.addEventListener('pointerdown', (e)=>{
  e.preventDefault();
  if (!S.running) { hideStart(); start(); }
}, {passive:false});
addEventListener('keydown', (e)=>{
  if (!S.running && !startOverlay.classList.contains('hidden')) {
    hideStart(); start();
  }
});

/* Canvas tap/hold shooting */
let touchActiveCanvas = false;
c.addEventListener('pointerdown', (e) => {
  touchActiveCanvas = true;
  shoot();
  e.preventDefault();
}, { passive:false });
['pointerup','pointercancel','pointerleave','pointerout'].forEach(ev =>
  c.addEventListener(ev, () => { touchActiveCanvas = false; })
);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) touchActiveCanvas = false;
});
addEventListener('blur', () => { touchActiveCanvas = false; });

/* On-screen buttons */
const btnLeft  = document.getElementById('btnLeft');
const btnRight = document.getElementById('btnRight');
const btnFire  = document.getElementById('btnFire');
let leftPressed = false, rightPressed = false, firePressed = false;
function bindHold(btn, setter){
  const down = (e)=>{ setter(true); e.preventDefault(); };
  const up   = (e)=>{ setter(false); e.preventDefault(); };
  btn.addEventListener('pointerdown', down, {passive:false});
  ['pointerup','pointerleave','pointercancel','pointerout'].forEach(ev =>
    btn.addEventListener(ev, up, {passive:false})
  );
  btn.addEventListener('mousedown', down);
  ['mouseup','mouseleave'].forEach(ev => btn.addEventListener(ev, up));
}
bindHold(btnLeft,  v=> leftPressed  = v);
bindHold(btnRight, v=> rightPressed = v);
bindHold(btnFire,  v=> firePressed  = v);

/* ==================== Assets ==================== */
const shipImg = new Image(); shipImg.src = PLAYER_IMG_SRC;
let shipReady = false, shipW = 64, shipH = 64, shipNatural = {w:64,h:64};
shipImg.onload = () => {
  shipReady = true;
  shipNatural.w = shipImg.naturalWidth||64;
  shipNatural.h = shipImg.naturalHeight||64;
  recalcSpriteSizes();
};

const beanImg = new Image();
/* 🎁 Present bullet (was bean) */
const beanSVG = "<svg xmlns='http://www.w3.org/2000/svg' width='32' height='48' viewBox='0 0 32 48'>\
<rect x='4' y='8' width='24' height='28' rx='4' fill='#ef4444'/>\
<rect x='15' y='6' width='4' height='32' fill='#facc15'/>\
<rect x='4' y='20' width='24' height='4' fill='#facc15'/>\
<circle cx='16' cy='10' r='4' fill='#fe
