<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Xmas Bean Blaster — mobile</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root{
    --card:#020617;         /* darker night sky */
    --accent:#22c55e;       /* festive green */
    --ink:#f9fafb;
  }
  html,body{
    margin:0;
    height:100%;
    background:radial-gradient(circle at top, #0f172a 0, #020617 55%);
    color:var(--ink);
    font-family:system-ui,Arial;
  }
  .page{
    min-height:100svh;
    display:grid;
    place-items:center;
    padding:12px;
  }
  /* Stage = same CSS size as the canvas, set from JS */
  .stage{
    position:relative;
    display:block;
  }
  canvas#game{
    width:100%;
    height:100%;
    background:linear-gradient(#020617,#020617);
    border:2px solid var(--accent);
    border-radius:16px;
    box-shadow:0 12px 30px rgba(0,0,0,.6);
    touch-action:none;
  }

  /* Title + HUD inside the display */
  .titlebar{
    position:absolute;
    top:8px;
    left:50%;
    transform:translateX(-50%);
    font-weight:800;
    opacity:.95;
    z-index:3;
    letter-spacing:.4px;
    text-shadow:0 2px 4px rgba(0,0,0,.6);
  }
  .hud{
    position:absolute;
    top:36px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:14px;
    font-weight:700;
    background:rgba(15,23,42,.9);
    padding:6px 10px;
    border-radius:999px;
    z-index:3;
    box-shadow:0 4px 12px rgba(0,0,0,.6);
    border:1px solid rgba(248,250,252,.15);
  }

  /* Overlays */
  .overlay{
    position:absolute;
    inset:0;
    display:grid;
    place-items:center;
    z-index:5;
    color:#e6efff;
    text-align:center;
    text-shadow:0 2px 6px rgba(0,0,0,.6);
  }
  .overlay-bg{
    position:absolute;
    inset:0;
    border-radius:16px;
    background:linear-gradient(
      transparent,
      rgba(15,23,42,.8) 40%,
      rgba(15,23,42,.95)
    );
  }
  .start .pill{
    position:relative;
    background:rgba(15,23,42,.95);
    border:1px solid #1b2557;
    border-radius:999px;
    padding:10px 16px;
    font-weight:800;
  }
  .winbox{
    position:relative;
    background:rgba(15,23,42,.95);
    border:1px solid #22c55e;
    border-radius:16px;
    padding:12px;
    display:flex;
    flex-direction:column;
    gap:10px;
    align-items:center;
    box-shadow:0 10px 30px rgba(0,0,0,.7);
  }
  .winbox video{
    max-width:88%;
    max-height:48vh;
    border-radius:12px;
    display:block;
    background:#000;
  }
  .winbox figcaption{
    font-weight:800;
    letter-spacing:.3px;
  }
  .btn{
    background:var(--accent);
    border:none;
    color:#fff;
    padding:10px 16px;
    border-radius:999px;
    cursor:pointer;
    font-weight:700;
  }

  .hidden{display:none !important;}

  /* Controls inside the display (bottom-center) */
  .touch-controls{
    position:absolute;
    left:0;
    right:0;
    bottom:10px;
    display:flex;
    justify-content:center;
    gap:12px;
    padding:0 10px;
    pointer-events:none;
    z-index:3;
  }
  .tc-group{
    display:flex;
    gap:12px;
    pointer-events:auto;
  }
  .tc-btn{
    min-width:clamp(50px,13vw,70px);
    min-height:clamp(50px,13vw,70px);
    border-radius:14px;
    border:1px solid #1b2557;
    background:radial-gradient(circle at 30% 10%, #1e293b, #020617);
    color:#e5e7eb;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    user-select:none;
    touch-action:none;
    box-shadow:0 4px 14px rgba(0,0,0,.6);
  }
  .tc-btn:active{transform:scale(.98)}
  .tc-fire{
    min-width:clamp(72px,20vw,102px);
  }
  @media (prefers-reduced-motion:reduce){
    .tc-btn{transition:none}
  }
</style>
</head>
<body>
  <div class="page">
    <!-- Stage matches canvas size exactly -->
    <div id="stage" class="stage" aria-label="Game area">
      <div class="titlebar">Christmas Bean Blaster 🎄</div>
      <div class="hud">
        <div>Gifts: <span id="beans">0</span></div>
        <div>Lives: <span id="lives">3</span></div>
      </div>

      <canvas id="game" width="480" height="720" aria-label="Bjorn Beans canvas"></canvas>

      <!-- Start overlay -->
      <div id="startOverlay" class="overlay start">
        <div class="overlay-bg"></div>
        <div class="pill">Tap to start delivering gifts 🎁</div>
      </div>

      <!-- Win overlay (VIDEO + footer + play again) -->
      <div id="winOverlay" class="overlay hidden" aria-live="polite">
        <div class="overlay-bg"></div>
        <figure class="winbox">
          <video id="winVideo" playsinline muted autoplay controls></video>
          <figcaption>Merry Christmas!! 🎄</figcaption>
          <button id="playAgain" class="btn">Play again</button>
        </figure>
      </div>

      <!-- Controls INSIDE the display -->
      <div id="touchControls" class="touch-controls">
        <div class="tc-group">
          <button id="btnLeft"  class="tc-btn" aria-label="Move left">⬅️</button>
          <button id="btnRight" class="tc-btn" aria-label="Move right">➡️</button>
        </div>
        <div class="tc-group">
          <button id="btnFire"  class="tc-btn tc-fire" aria-label="Fire">🎄 FIRE</button>
        </div>
      </div>
    </div>
  </div>

<script>
/* ==================== CONFIG ==================== */
const BASE_W = 480, BASE_H = 720;                // logical game size
const VERSION = "v21-xmas-lights-snow";          // bump to bust cache

/* Xmas ship + Navidad video */
const PLAYER_IMG_FILE = "ship1.png";
const PLAYER_IMG_SRC  = `./${PLAYER_IMG_FILE}?v=${VERSION}`;

const WIN_VIDEO_FILE = "Navidad.mp4";
const WIN_VIDEO_SRC  = `./${WIN_VIDEO_FILE}?v=${VERSION}`;

const BASE_SHIP_HEIGHT = 108;

/* Gifts (bullets) slightly bigger */
const BASE_BEAN_W = 28, BASE_BEAN_H = 42;

/* Snowmen (enemies) slightly bigger */
const ENEMY_BASE_W = 28, ENEMY_BASE_H = 24;
const ENEMY_SCALE  = 1.45;
const ENEMY_COLS = 7, ENEMY_ROWS = 3;

/* Optional external images (leave "" to use built-in SVGs) */
const BEAN_IMG_SRC  = "";
const ALIEN_IMG_SRC = "";

/* Snow + lights config */
const SNOW_COUNT = 70;
const snow = []; // {x,y,r,vy}

/* ============== Canvas (HiDPI + responsive fit) ============== */
const stage = document.getElementById('stage');
const c = document.getElementById('game');
const g = c.getContext('2d');
const touchControls = document.getElementById('touchControls');
const startOverlay  = document.getElementById('startOverlay');
const winOverlay    = document.getElementById('winOverlay');
const winVideoEl    = document.getElementById('winVideo');
const playAgainBtn  = document.getElementById('playAgain');

const titleEl = document.querySelector('.titlebar');
const hudEl   = document.querySelector('.hud');

let scaleCSS = 1, dpr = 1, SAFE_BOTTOM = 100, SAFE_TOP = 0;

/** Fit by BOTH width & height; stage size == canvas CSS size */
function resizeCanvas(){
  const vw = window.innerWidth, vh = window.innerHeight;
  const margin = 12;
  const availW = Math.max(320, vw - margin*2);
  const availH = Math.max(360, vh - margin*2);

  const scaleByW = availW / BASE_W;
  const scaleByH = availH / BASE_H;
  const MIN_SCALE = 0.35, MAX_SCALE = 0.85;
  scaleCSS = Math.max(MIN_SCALE, Math.min(MAX_SCALE, Math.min(scaleByW, scaleByH)));

  const cssW = Math.round(BASE_W * scaleCSS);
  const cssH = Math.round(BASE_H * scaleCSS);

  stage.style.width  = cssW + 'px';
  stage.style.height = cssH + 'px';

  dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1)); // cap DPR for perf
  c.width  = Math.round(BASE_W * dpr);
  c.height = Math.round(BASE_H * dpr);
  g.setTransform(dpr, 0, 0, dpr, 0, 0);

  const ctrlH_css  = touchControls.getBoundingClientRect().height || 110;
  const titleH_css = titleEl?.getBoundingClientRect().height || 0;
  const hudH_css   = hudEl?.getBoundingClientRect().height   || 0;

  SAFE_BOTTOM = Math.round((ctrlH_css / cssH) * BASE_H) + 8;
  SAFE_TOP    = Math.round(((titleH_css + hudH_css + 10) / cssH) * BASE_H);

  recalcSpriteSizes();
}
addEventListener('resize', resizeCanvas);

/* ==================== Inputs ==================== */
const keys = {};
addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.code === 'Space') e.preventDefault();
}, {passive:false});
addEventListener('keyup',   e => keys[e.key.toLowerCase()] = false);

/* Start overlay actions */
function hideStart(){ startOverlay.classList.add('hidden'); }
startOverlay.addEventListener('pointerdown', (e)=>{
  e.preventDefault();
  if (!S.running) { hideStart(); start(); }
}, {passive:false});
addEventListener('keydown', (e)=>{
  if (!S.running && !startOverlay.classList.contains('hidden')) {
    hideStart(); start();
  }
});

/* Canvas tap/hold shooting */
let touchActiveCanvas = false;
c.addEventListener('pointerdown', (e) => {
  touchActiveCanvas = true;
  shoot();
  e.preventDefault();
}, { passive:false });
['pointerup','pointercancel','pointerleave','pointerout'].forEach(ev =>
  c.addEventListener(ev, () => { touchActiveCanvas = false; })
);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) touchActiveCanvas = false;
});
addEventListener('blur', () => { touchActiveCanvas = false; });

/* On-screen buttons */
const btnLeft  = document.getElementById('btnLeft');
const btnRight = document.getElementById('btnRight');
const btnFire  = document.getElementById('btnFire');
let leftPressed = false, rightPressed = false, firePressed = false;
function bindHold(btn, setter){
  const down = (e)=>{ setter(true); e.preventDefault(); };
  const up   = (e)=>{ setter(false); e.preventDefault(); };
  btn.addEventListener('pointerdown', down, {passive:false});
  ['pointerup','pointerleave','pointercancel','pointerout'].forEach(ev =>
    btn.addEventListener(ev, up, {passive:false})
  );
  btn.addEventListener('mousedown', down);
  ['mouseup','mouseleave'].forEach(ev => btn.addEventListener(ev, up));
}
bindHold(btnLeft,  v=> leftPressed  = v);
bindHold(btnRight, v=> rightPressed = v);
bindHold(btnFire,  v=> firePressed  = v);

/* ==================== Assets ==================== */
const shipImg = new Image(); shipImg.src = PLAYER_IMG_SRC;
let shipReady = false, shipW = 64, shipH = 64, shipNatural = {w:64,h:64};
shipImg.onload = () => {
  shipReady = true;
  shipNatural.w = shipImg.naturalWidth||64;
  shipNatural.h = shipImg.naturalHeight||64;
  recalcSpriteSizes();
};

const beanImg = new Image();
/* 🎁 Present bullet (was bean) */
const beanSVG = "<svg xmlns='http://www.w3.org/2000/svg' width='32' height='48' viewBox='0 0 32 48'>\
<rect x='6' y='10' width='20' height='26' rx='3.5' fill='#ef4444'/>\
<rect x='15' y='8' width='4' height='30' fill='#facc15'/>\
<rect x='6' y='21' width='20' height='4' fill='#facc15'/>\
<circle cx='16' cy='11' r='3.5' fill='#fef9c3'/>\
</svg>";
beanImg.src = BEAN_IMG_SRC || ('data:image/svg+xml;utf8,' + encodeURIComponent(beanSVG));
let beanReady = false; beanImg.onload = ()=> beanReady = true;

const alienImg = new Image();
/* ⛄ Snowman enemy (was alien) */
const alienSVG = "<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'>\
<rect width='24' height='24' fill='none'/>\
<circle cx='12' cy='9' r='4' fill='#e5e7eb'/>\
<circle cx='12' cy='17' r='5' fill='#e5e7eb'/>\
<circle cx='10.3' cy='8.5' r='0.9' fill='#020617'/>\
<circle cx='13.7' cy='8.5' r='0.9' fill='#020617'/>\
<polygon points='12,9.5 12,11.8 15.4,10.6' fill='#f97316'/>\
<rect x='7' y='4' width='10' height='2' fill='#0f172a'/>\
<rect x='9' y='2' width='6' height='3' fill='#ef4444'/>\
<circle cx='12' cy='14' r='0.8' fill='#0f172a'/>\
<circle cx='12' cy='16' r='0.8' fill='#0f172a'/>\
<circle cx='12' cy='18' r='0.8' fill='#0f172a'/>\
</svg>";
alienImg.src = ALIEN_IMG_SRC || ('data:image/svg+xml;utf8,' + encodeURIComponent(alienSVG));
let alienReady = false; alienImg.onload = ()=> { alienReady = true; };

/* ============== Dynamic sprite sizing ============== */
let BEAN_W = BASE_BEAN_W, BEAN_H = BASE_BEAN_H;
let ALIEN_W = Math.round(ENEMY_BASE_W * ENEMY_SCALE),
    ALIEN_H = Math.round(ENEMY_BASE_H * ENEMY_SCALE);

function recalcSpriteSizes(){
  const targetH = Math.round(BASE_SHIP_HEIGHT * scaleCSS);
  const s = targetH / (shipNatural.h || BASE_SHIP_HEIGHT);
  shipW = Math.max(24, Math.round((shipNatural.w || BASE_SHIP_HEIGHT) * s));
  shipH = Math.max(24, Math.round((shipNatural.h || BASE_SHIP_HEIGHT) * s));

  BEAN_W = Math.max(10, Math.round(BASE_BEAN_W * scaleCSS));
  BEAN_H = Math.max(16, Math.round(BASE_BEAN_H * scaleCSS));

  const alienBaseW = ENEMY_BASE_W * ENEMY_SCALE;
  const alienBaseH = ENEMY_BASE_H * ENEMY_SCALE;
  ALIEN_W = Math.max(16, Math.round(alienBaseW * scaleCSS));
  ALIEN_H = Math.max(12, Math.round(alienBaseH * scaleCSS));

  S.player.w = shipW;
  S.player.h = shipH;
  S.player.y = BASE_H - (SAFE_BOTTOM + S.player.h/2 + 8);
}

/* ============== Snow init ============== */
function initSnow(){
  snow.length = 0;
  for (let i = 0; i < SNOW_COUNT; i++){
    snow.push({
      x: Math.random()*BASE_W,
      y: Math.random()*BASE_H,
      r: 1.2 + Math.random()*2.2,
      vy: 0.5 + Math.random()*1.3
    });
  }
}

/* ==================== Game state ==================== */
const beansEl = document.getElementById('beans');
const livesEl = document.getElementById('lives');

const S = {
  running:false, beans:0, lives:3, tick:0, wave:0,
  player: { x:BASE_W/2, y:BASE_H-80, w:shipW, h:shipH, speed:4.2, cooldown:0 },
  bullets: [],
  enemies: [],
};

function reset(){
  S.running = true; S.beans = 0; S.lives = 3; S.tick = 0; S.wave = 0;
  S.player.x = BASE_W/2; S.player.cooldown = 0;
  recalcSpriteSizes();
  S.bullets.length = 0; S.enemies.length = 0;
  initSnow();
  spawnWave();
  beansEl.textContent = S.beans;
  livesEl.textContent = S.lives;
  winOverlay.classList.add('hidden');
  winVideoEl.pause();
}

/* Lose immediately if enemies touch player row */
function endGame(){
  S.running = false;
  startOverlay.classList.remove('hidden');
}

/* Show "win" overlay (after clearing all aliens) */
function showWin(){
  S.running = false;
  winVideoEl.pause();
  winVideoEl.currentTime = 0;
  winVideoEl.src = WIN_VIDEO_SRC + "&t=" + Date.now();
  winOverlay.classList.remove('hidden');
  winVideoEl.play().catch(() => {});
}

/* ==================== Entities ==================== */
function shoot(){
  if (S.player.cooldown > 0) return;
  S.bullets.push({
    x:S.player.x - BEAN_W/2,
    y:S.player.y - S.player.h/2 - BEAN_H + 6,
    vy:-8, w:BEAN_W, h:BEAN_H
  });
  S.player.cooldown = 8;
}
function spawnWave(){
  S.wave++;
  const gapX = Math.round(16 * scaleCSS), gapY = Math.round(14 * scaleCSS);
  const totalW = ENEMY_COLS * ALIEN_W + (ENEMY_COLS-1)*gapX;
  const startX = Math.max(10, (BASE_W - totalW)/2);

  const startY = Math.max(SAFE_TOP + 16, 110);

  for (let r=0;r<ENEMY_ROWS;r++){
    for (let cc=0; cc<ENEMY_COLS; cc++){
      S.enemies.push({
        x: startX + cc*(ALIEN_W + gapX),
        y: startY + r*(ALIEN_H + gapY),
        w: ALIEN_W, h: ALIEN_H, alive: true,
        baseX: startX + cc*(ALIEN_W + gapX),
        baseY: startY + r*(ALIEN_H + gapY),
      });
    }
  }
}

/* ==================== Collisions ==================== */
function rectHit(ax,ay,aw,ah,bx,by,bw,bh){
  return ax < bx+bw && ax+aw > bx && ay < by+bh && ay+ah > by;
}

/* ==================== Background helpers ==================== */
function updateSnow(){
  for (const flake of snow){
    flake.y += flake.vy;
    flake.x += Math.sin((flake.y + S.tick*0.4) * 0.01) * 0.2;
    if (flake.y > BASE_H){
      flake.y = -5;
      flake.x = Math.random()*BASE_W;
    }
  }
}

function drawBackground(){
  // gradient sky
  const grad = g.createLinearGradient(0,0,0,BASE_H);
  grad.addColorStop(0,"#020617");
  grad.addColorStop(0.4,"#020617");
  grad.addColorStop(1,"#020617");
  g.fillStyle = grad;
  g.fillRect(0,0,BASE_W,BASE_H);

  // soft snowy ground at bottom
  g.fillStyle = "rgba(248,250,252,0.9)";
  g.beginPath();
  const groundY = BASE_H - SAFE_BOTTOM + 40;
  g.moveTo(0, groundY);
  g.quadraticCurveTo(BASE_W*0.25, groundY-12, BASE_W*0.5, groundY-4);
  g.quadraticCurveTo(BASE_W*0.75, groundY+6, BASE_W, groundY-2);
  g.lineTo(BASE_W, BASE_H);
  g.lineTo(0, BASE_H);
  g.closePath();
  g.fill();

  // falling snowflakes
  g.globalAlpha = 0.95;
  g.fillStyle = "#e5e7eb";
  for (const flake of snow){
    g.beginPath();
    g.arc(flake.x, flake.y, flake.r, 0, Math.PI*2);
    g.fill();
  }
  g.globalAlpha = 1;
}

function drawLights(){
  const colors = ["#f97316","#22c55e","#facc15","#60a5fa","#fb7185"];
  const count = 24;
  const y = SAFE_TOP - 10;
  const phase = Math.floor(S.tick / 15);

  for (let i=0;i<count;i++){
    const x = (i+0.5) * (BASE_W / count);
    const color = colors[(i+phase)%colors.length];
    g.fillStyle = color;
    g.beginPath();
    g.arc(x, y, 3.3, 0, Math.PI*2);
    g.fill();

    // little glow
    g.globalAlpha = 0.35;
    g.beginPath();
    g.arc(x, y, 7, 0, Math.PI*2);
    g.fill();
    g.globalAlpha = 1;
  }
}

/* ==================== Loop ==================== */
function update(){
  S.tick++;

  const leftKey  = keys['arrowleft'] || keys['a'];
  const rightKey = keys['arrowright']|| keys['d'];
  const move = (rightKey || rightPressed ? 1 : 0) - (leftKey || leftPressed ? 1 : 0);
  S.player.x = Math.max(
    S.player.w/2,
    Math.min(BASE_W - S.player.w/2, S.player.x + move * S.player.speed)
  );

  const shootKey = keys[' '] || keys['space'];
  if (touchActiveCanvas || firePressed || shootKey) shoot();
  if (S.player.cooldown>0) S.player.cooldown--;

  for(const b of S.bullets){ b.y += b.vy; }
  S.bullets = S.bullets.filter(b => b.y > -60);

  const amp = 22 + Math.min(S.tick/10, 46);
  const speed = 0.5 + Math.min(S.tick/600, 1.2);
  for (const e of S.enemies){
    const phase = (e.baseX + e.baseY)*0.01;
    e.x = e.baseX + Math.sin(S.tick*0.03 + phase)*amp;
    e.y = e.baseY + Math.sin(S.tick*0.015 + phase*0.7)*4 + (S.tick*0.02*speed);
    if (e.y + e.h >= S.player.y - 6) {
      S.lives = 0;
      livesEl.textContent = S.lives;
      endGame();
    }
  }

  for (const b of S.bullets){
    for (const e of S.enemies){
      if (!e.alive) continue;
      if (rectHit(b.x,b.y,b.w,b.h, e.x,e.y,e.w,e.h)){
        e.alive = false; b.y = -9999;
        S.beans += 10;
        beansEl.textContent = S.beans;
      }
    }
  }
  S.enemies = S.enemies.filter(e => e.alive);

  updateSnow();

  if (S.enemies.length === 0 && S.running) {
    showWin();
  }
}

function draw(){
  drawBackground();
  drawLights();

  const p = S.player;
  if (shipReady){
    g.drawImage(shipImg, p.x - p.w/2, p.y - p.h/2, p.w, p.h);
  } else {
    g.fillStyle = "#bfdbfe";
    g.beginPath();
    g.moveTo(p.x, p.y-24);
    g.lineTo(p.x-20, p.y+22);
    g.lineTo(p.x+20, p.y+22);
    g.closePath();
    g.fill();
  }

  for (const b of S.bullets){
    if (beanReady){
      g.drawImage(beanImg, b.x, b.y, b.w, b.h);
    } else {
      g.fillStyle = "#facc15";
      g.fillRect(b.x, b.y, b.w, b.h);
    }
  }

  for (const e of S.enemies){
    if (alienReady){
      g.drawImage(alienImg, e.x, e.y, e.w, e.h);
    } else {
      g.fillStyle = "#e5e7eb";
      g.fillRect(e.x, e.y, e.w, e.h);
    }
  }
}

function loop(){
  if (!S.running) return;
  update();
  draw();
  requestAnimationFrame(loop);
}

/* ==================== Boot ==================== */
function start(){ reset(); loop(); }
resizeCanvas();
initSnow();
setTimeout(resizeCanvas, 0);

/* Play again handler */
playAgainBtn.addEventListener('click', () => {
  winOverlay.classList.add('hidden');
  start();
});
</script>
</body>
</html>
